<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Remove margens e faz o body ocupar 100% da tela */
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            font-family: Arial, sans-serif;
            overflow: hidden; /* Evita barras de rolagem */
        }

        /* Container principal que ocupa a tela toda */
        .tela-toda {
            background-color: #e0e0e0; /* Cinza claro da imagem */
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center; /* Centraliza horizontalmente */
            align-items: center;     /* Centraliza verticalmente */
            position: relative;
        }

        /* Menu no canto superior direito */
        nav {
            position: absolute;
            top: 30px;
            right: 40px;
        }

        nav a {
            text-decoration: none;
            color: #333;
            margin-left: 25px;
            font-weight: 500;
            font-size: 1.1rem;
        }

        /* O círculo/rosto centralizado */
        .rosto {
            width: 100px;
            height: 100px;
            border: 2px solid #333;
            border-radius: 50%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Olhos e Sorriso simples com CSS */
        .olhos { display: flex; gap: 20px; margin-bottom: 5px; }
        .olho { width: 8px; height: 8px; background: #333; border-radius: 50%; }
        .sorriso { 
            width: 40px; height: 20px; 
            border-bottom: 2px solid #333; 
            border-radius: 0 0 40px 40px; 
        }

        /* Rodapé no canto inferior */
        footer {
            position: absolute;
            bottom: 15px;
            left: 20px;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="tela-toda">
        <nav>
            <a href="#">HOME</a>
            <a href="#">SOBRE</a>
            <a href="#">CONTATO</a>
        </nav>

        <!-- Desenho do rosto centralizado -->
        <div class="rosto">
            <div class="olhos">
                <div class="olho"></div>
                <div class="olho"></div>
            </div>
            <div class="sorriso"></div>
        </div>

        <footer>Fundamentos de Desenvolvimento Web</footer>
    </div>

</body>
</html>
